<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宝贝成长记 · Baby Growth</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%8D%BC%3C%2Ftext%3E%3C%2Fsvg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@500;600;700&family=Caveat:wght@500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --c-primary:#ef8fa4; --c-primary-d:#e06e88; --c-primary-strong:#cf5f7d; --c-secondary:#7fc8d4; --c-secondary-d:#3f8f9c; --c-accent:#ffca7a;
  --c-bg:#fff7f4; --c-bg2:#ffffff; --c-ink:#4b4a5a; --c-muted:#726d81; --c-line:#f0e3dd;
  --deco-opacity:0.5; --radius:22px; --shadow:0 10px 30px rgba(224,110,136,.12); --shadow-sm:0 4px 14px rgba(0,0,0,.06);
  --maxw:1160px; --font: "Quicksand","Baloo 2","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--c-ink);background:var(--c-bg);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
input,textarea,select{font-family:inherit;font-size:1rem}
h1,h2,h3,h4{font-family:"Baloo 2","Quicksand","PingFang SC",sans-serif;line-height:1.25;color:#3f3d4e}
.container{max-width:var(--maxw);margin:0 auto;padding:0 6%}
.section{padding:64px 0}
.section-title{font-size:1.9rem;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.section-sub{color:var(--c-muted);margin-bottom:34px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;background:var(--c-primary-strong);color:#fff;font-weight:600;transition:.25s;box-shadow:0 6px 16px rgba(207,95,125,.32)}
.btn:hover{filter:brightness(.94);transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--c-primary-d);box-shadow:var(--shadow-sm);border:1.5px solid var(--c-line)}
.btn.sm{padding:7px 15px;font-size:.86rem}
.btn.gray{background:#eee7f0;color:#6a6780;box-shadow:none}
.btn.danger{background:#f2787a}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;background:rgba(127,200,212,.18);color:#3f8f9c;font-size:.78rem;font-weight:600}
.card{background:var(--c-bg2);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(240,227,221,.7)}
.grid{display:grid;gap:22px}
.reveal{opacity:0;transform:translateY(28px);transition:.7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ===== decorations ===== */
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:var(--deco-opacity)}
#deco span{position:absolute;font-size:2rem;animation:float 12s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(8deg)}}
#app{position:relative;z-index:1}

/* ===== top nav ===== */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,247,244,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--c-line)}
.nav .container{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Baloo 2";font-weight:700;font-size:1.2rem;color:var(--c-primary-d)}
.brand .logo{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));display:grid;place-items:center;font-size:1.2rem;box-shadow:var(--shadow-sm)}
.nav-links{display:flex;gap:3px;flex:1;min-width:0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-ms-overflow-style:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links>a:first-child{margin-left:auto}
.nav-links a{padding:7px 11px;border-radius:999px;font-weight:600;font-size:.9rem;color:#6c6980;transition:.2s;white-space:nowrap;flex:none}
.nav-links a:hover{background:#fff;color:var(--c-primary-d)}
.nav-links a.active{background:var(--c-primary);color:#fff}
.more-wrap{position:relative;flex:none}
.more-btn{padding:7px 11px;border-radius:999px;font-weight:600;font-size:.9rem;color:#6c6980;white-space:nowrap;cursor:pointer;transition:.2s}
.more-btn .carat{font-size:.7rem;opacity:.75;margin-left:2px}
.more-btn:hover,.more-btn.active{background:#fff;color:var(--c-primary-d)}
.more-menu{display:none;position:fixed;top:auto;right:auto;min-width:160px;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:1200;flex-direction:column;gap:2px;animation:mmpop .16s ease-out}
.more-menu.show{display:flex}
.more-menu a{padding:9px 14px;border-radius:8px;font-weight:600;font-size:.92rem;color:#4b4a5a;white-space:nowrap;cursor:pointer;transition:.15s}
.more-menu a:hover{background:var(--c-bg);color:var(--c-primary-d)}
.more-menu a.active{background:var(--c-primary);color:#fff}
/* nav-emoji: 桌面顶栏隐藏（空间紧张）；桌面"更多"下拉浮层里显示；移动抽屉全部显示 */
.nav-emoji{display:none;text-align:center;width:1.4em;line-height:1;flex:none}
.more-menu>a .nav-emoji{display:inline-block;margin-right:8px;font-size:1.02rem}
@keyframes mmpop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.nav .adminlink{margin-left:6px}
.menu-btn{display:none;margin-left:auto;font-size:1.5rem}

/* ===== hero ===== */
.hero{position:relative;padding:76px 0 90px;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:-1;background:linear-gradient(120deg,#ffe3ec,#e3f4f7,#fff2d9);background-size:300% 300%;animation:grad 16s ease infinite}
@keyframes grad{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.hero-inner{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:3rem;margin-bottom:14px}
.hero h1 .accent{color:var(--c-primary-d)}
.hero p.lead{font-size:1.12rem;color:#6c6980;margin-bottom:26px;max-width:520px}
.hero-stats{display:flex;gap:26px;margin-top:30px}
.hero-stats .s b{font-size:1.7rem;font-family:"Baloo 2";color:var(--c-primary-d);display:block}
.hero-stats .s span{font-size:.85rem;color:var(--c-muted)}
.hero-photo{position:relative;aspect-ratio:4/5;box-sizing:border-box;background:#fff;border:14px solid #fff;border-bottom-width:56px;border-radius:6px;overflow:hidden;box-shadow:0 24px 60px rgba(224,110,136,.28),0 8px 20px rgba(0,0,0,.08);transform:rotate(2deg)}

/* ========== 相框风格切换：默认 polaroid（上面规则），下面是其它风格的覆盖 ========== */
/* —— 白边墙：均匀白边，无底部厚白，方形 —— */
html.frame-matted .photos .p,
html.frame-matted .tl-card .tl-img,
html.frame-matted .diary .ph,
html.frame-matted .ms-card .ph,
html.frame-matted .vthumb,
html.frame-matted .alb{aspect-ratio:1/1;border-width:10px;border-bottom-width:10px;border-radius:6px;box-shadow:0 6px 18px rgba(60,40,50,.12)}
html.frame-matted .hero-photo{border-width:12px;border-bottom-width:12px;border-radius:8px;transform:none;box-shadow:0 12px 32px rgba(60,40,50,.14)}
html.frame-matted .photos .p:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(60,40,50,.18)}
html.frame-matted .alb:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(60,40,50,.2)}

/* —— 复古木质：褐色边框，深阴影 —— */
html.frame-wood .photos .p,
html.frame-wood .tl-card .tl-img,
html.frame-wood .diary .ph,
html.frame-wood .ms-card .ph,
html.frame-wood .vthumb,
html.frame-wood .alb{aspect-ratio:1/1;border:12px solid #8b6b47;background:#8b6b47;border-radius:2px;box-shadow:0 8px 22px rgba(80,50,30,.28),inset 0 0 0 2px rgba(0,0,0,.18)}
html.frame-wood .hero-photo{border:16px solid #8b6b47;background:#8b6b47;border-radius:3px;transform:none;box-shadow:0 16px 44px rgba(80,50,30,.35),inset 0 0 0 2px rgba(0,0,0,.2)}
html.frame-wood .photos .p:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(80,50,30,.36),inset 0 0 0 2px rgba(0,0,0,.18)}
html.frame-wood .alb:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(80,50,30,.4)}

/* —— 无框：干净圆角+柔和阴影 —— */
html.frame-none .photos .p,
html.frame-none .tl-card .tl-img,
html.frame-none .diary .ph,
html.frame-none .ms-card .ph,
html.frame-none .vthumb,
html.frame-none .alb{aspect-ratio:1/1;border:0;background:transparent;border-radius:14px;box-shadow:var(--shadow-sm)}
html.frame-none .ms-card .ph,
html.frame-none .diary .ph,
html.frame-none .vthumb{border-radius:14px 14px 0 0}
html.frame-none .hero-photo{border:0;background:transparent;border-radius:22px;transform:none;box-shadow:var(--shadow)}

/* ========== 宝丽来底部白边显示日期（手写体） ========== */
/* 宝丽来模式下：让容器 overflow 可见，image 的 clipping 由 mthumb 负责 */
html.frame-polaroid .photos .p,
html.frame-polaroid .tl-card .tl-img,
html.frame-polaroid .diary .ph,
html.frame-polaroid .ms-card .ph,
html.frame-polaroid .vthumb,
html.frame-polaroid .hero-photo{overflow:visible;position:relative}

/* 日期用 ::after 渲染在 border-bottom 区域 —— 只有 [data-date] 存在时才显示 */
html.frame-polaroid .photos .p[data-date]::after,
html.frame-polaroid .tl-card .tl-img[data-date]::after,
html.frame-polaroid .diary .ph[data-date]::after,
html.frame-polaroid .ms-card .ph[data-date]::after,
html.frame-polaroid .vthumb[data-date]::after,
html.frame-polaroid .hero-photo[data-date]::after{
  content:attr(data-date);
  position:absolute;top:100%;left:0;right:0;
  height:34px;
  display:grid;place-items:center;
  font-family:'Caveat','Ma Shan Zheng','STKaiti','KaiTi','楷体','PingFang SC',cursive;
  font-size:.95rem;color:#7a5238;
  pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 8px;letter-spacing:.02em;
}

/* 分容器：让日期高度与各自的 border-bottom-width 匹配 */
html.frame-polaroid .ms-card .ph[data-date]::after,
html.frame-polaroid .diary .ph[data-date]::after,
html.frame-polaroid .vthumb[data-date]::after{height:20px;font-size:.72rem}
html.frame-polaroid .tl-card .tl-img[data-date]::after{height:28px;font-size:.85rem}
html.frame-polaroid .hero-photo[data-date]::after{height:56px;font-size:1.35rem;color:#8f5e2b}
html.frame-none .photos .p:hover{transform:scale(1.04);box-shadow:var(--shadow)}
html.frame-none .alb:hover{transform:translateY(-3px);box-shadow:var(--shadow)}

/* ========== AdSettings 里的四个风格预览按钮 ========== */
.frame-picker{display:flex;gap:12px;flex-wrap:wrap}
.frame-picker button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 12px;border:2px solid var(--c-line);border-radius:14px;background:#fff;cursor:pointer;font-family:inherit;font-weight:600;font-size:.86rem;color:var(--c-ink);transition:.2s;min-width:104px}
.frame-picker button:hover{border-color:var(--c-primary)}
.frame-picker button.on{border-color:var(--c-primary);background:linear-gradient(135deg,#fef4f6,#fef8fa);color:var(--c-primary-strong);box-shadow:0 4px 12px rgba(224,110,136,.15)}
.frame-picker .preview{display:block;background:linear-gradient(135deg,#7fc8d4,#ef8fa4);box-sizing:border-box;flex:none}
.frame-picker .preview-polaroid{width:56px;height:72px;border:5px solid #fff;border-bottom-width:18px;border-radius:2px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.frame-picker .preview-matted{width:60px;height:60px;border:6px solid #fff;border-radius:4px;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.frame-picker .preview-wood{width:60px;height:60px;border:7px solid #8b6b47;border-radius:2px;box-shadow:0 3px 8px rgba(80,50,30,.28),inset 0 0 0 1px rgba(0,0,0,.2)}
.frame-picker .preview-none{width:60px;height:60px;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.frame-picker .lbl{font-size:.82rem}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-badge{position:absolute;left:-14px;bottom:24px;background:#fff;border-radius:16px;padding:10px 16px;box-shadow:var(--shadow);transform:rotate(-4deg);font-weight:700;color:var(--c-primary-d)}

/* ===== carousel ===== */
.carousel{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:16/7;background:#eee}
.carousel .slide{position:absolute;inset:0;opacity:0;transition:opacity 1s;background-size:cover;background-position:center}
.carousel .slide.on{opacity:1}
.carousel .cap{position:absolute;left:0;right:0;bottom:0;padding:26px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-weight:600}
.carousel .dots{position:absolute;bottom:14px;right:18px;display:flex;gap:7px}
.carousel .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}
.carousel .dots i.on{background:#fff;width:22px;border-radius:5px}

/* ===== milestone cards ===== */
.ms-grid{grid-template-columns:repeat(3,1fr)}
.ms-card{overflow:hidden;transition:.3s}
.ms-card:hover{transform:translateY(-6px)}
.ms-card .ph{aspect-ratio:4/3;box-sizing:border-box;background:#fff;border:8px solid #fff;border-bottom-width:20px;border-radius:16px 16px 0 0;overflow:hidden}
.ms-card .bd{padding:18px 20px}
.ms-card .dt{font-size:.8rem;color:var(--c-secondary-d);font-weight:700}
.ms-card h4{margin:4px 0 6px;font-size:1.12rem}
.ms-card p{color:var(--c-muted);font-size:.92rem}

/* ===== timeline ===== */
.tl{position:relative;max-width:820px;margin:0 auto;padding-left:12px}
.tl::before{content:"";position:absolute;left:22px;top:8px;bottom:8px;width:3px;background:linear-gradient(var(--c-primary),var(--c-secondary))}
.tl-item{position:relative;padding:0 0 34px 60px}
.tl-item .dot{position:absolute;left:12px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--c-primary);box-shadow:0 0 0 4px rgba(239,143,164,.15)}
.tl-item .yr{position:absolute;left:-4px;top:-2px}
.tl-card{padding:16px 20px}
.tl-card .tl-img:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 12px 28px rgba(60,40,50,.18)}
.tl-card .dt{color:var(--c-secondary-d);font-weight:700;font-size:.82rem}
.tl-card h4{margin:3px 0 6px}
.tl-card .tl-img{margin-top:14px;box-sizing:border-box;background:#fff;border:8px solid #fff;border-bottom-width:28px;border-radius:3px;aspect-ratio:4/3;overflow:hidden;box-shadow:0 6px 18px rgba(60,40,50,.13);transition:transform .3s,box-shadow .3s;cursor:pointer}
.yr-filter{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.yr-filter button{padding:6px 16px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);font-weight:600;color:#6c6980}
.yr-filter button.on{background:var(--c-primary);color:#fff}

/* ===== gallery ===== */
.alb-grid{grid-template-columns:repeat(3,1fr)}
.alb{position:relative;box-sizing:border-box;background:#fff;border:8px solid #fff;border-bottom-width:36px;border-radius:4px;aspect-ratio:3/4;overflow:hidden;cursor:pointer;box-shadow:0 8px 22px rgba(60,40,50,.16);transition:transform .35s,box-shadow .35s}
.alb .cover{position:absolute;inset:0;background-size:cover;background-position:center;transition:.5s}
.alb:hover .cover{transform:scale(1.07)}
.alb:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:0 16px 38px rgba(60,40,50,.22)}
.alb .ov{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.6));display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff}
.alb .ov h4{color:#fff}
.alb .ov span{font-size:.82rem;opacity:.85}
.photos{grid-template-columns:repeat(4,1fr);gap:20px}
.photos .p{aspect-ratio:3/4;box-sizing:border-box;background:#fff;border:8px solid #fff;border-bottom-width:34px;border-radius:3px;overflow:hidden;cursor:pointer;box-shadow:0 6px 20px rgba(60,40,50,.14),0 2px 5px rgba(60,40,50,.06);transition:transform .35s cubic-bezier(.2,.9,.3,1.15),box-shadow .35s}
.photos .p:hover{transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 14px 34px rgba(60,40,50,.2),0 4px 10px rgba(60,40,50,.08);z-index:1}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(20,15,20,.9);z-index:200;display:grid;place-items:center;padding:30px}
.lb-fig{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:92vw;max-height:92vh;margin:0}
.lb-media{max-width:92vw;max-height:78vh;width:auto;height:auto;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
.lb-cap{color:#fff;text-align:center;max-width:min(92vw,720px)}
.lb-title{font-weight:700;font-size:1.02rem}
.lb-desc{opacity:.85;font-size:.92rem;margin-top:3px;white-space:pre-wrap}
.lb-meta{opacity:.8;font-size:.82rem;margin-top:8px;display:flex;gap:10px;align-items:center;justify-content:center}
.lb-input{width:min(82vw,520px);padding:9px 12px;border-radius:10px;border:none;margin-top:6px;font-family:inherit;font-size:.95rem}
.lb .x{position:absolute;top:20px;right:26px;font-size:2rem;color:#fff}
.lb .arw{position:absolute;top:50%;transform:translateY(-50%);font-size:2.4rem;color:#fff;padding:18px;user-select:none}
.lb .arw.l{left:10px}.lb .arw.r{right:10px}
.lb .cap{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#fff}

/* ===== growth ===== */
.chart{height:340px;width:100%}
.tbl{width:100%;border-collapse:collapse;overflow:hidden;border-radius:14px}
.tbl th,.tbl td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--c-line)}
.tbl th{background:#fbeef0;color:#8a5566;font-size:.85rem}
.tbl tr:hover td{background:#fff9fa}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.stat{padding:20px;text-align:center}
.stat b{font-size:1.8rem;font-family:"Baloo 2";color:var(--c-primary-d);display:block}
.stat span{color:var(--c-muted);font-size:.85rem}

/* ===== daily ===== */
.prog{height:20px;border-radius:999px;background:#f0e3dd;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c-secondary),var(--c-primary));border-radius:999px;transition:width .6s}
.feed-timer{font-family:"Baloo 2";font-size:2.4rem;color:var(--c-primary-d)}
.log{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;background:#fff;box-shadow:var(--shadow-sm);margin-bottom:10px}
.log .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;flex:none}
.log .ic.feed{background:#e5f4f7}.log .ic.pee{background:#fff3d6}.log .ic.poop{background:#efe4d8}

/* ===== diary ===== */
.diary-grid{grid-template-columns:repeat(2,1fr)}
.diary .ph{aspect-ratio:4/3;box-sizing:border-box;background:#fff;border:8px solid #fff;border-bottom-width:20px;border-radius:16px 16px 0 0;overflow:hidden;box-shadow:0 3px 10px rgba(60,40,50,.06) inset}
.diary .bd{padding:20px 22px}
.diary .bd .dt{color:var(--c-secondary-d);font-weight:700;font-size:.82rem}
.diary .bd h3{margin:5px 0 8px}
.diary .bd p{color:#6c6980}

/* ===== messages ===== */
.msg-grid{grid-template-columns:repeat(3,1fr)}
.msg{padding:18px 20px;position:relative}
.msg .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.msg .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.msg p{color:#5b5870}
.msg .t{font-size:.76rem;color:var(--c-muted);margin-top:8px}

/* ===== about ===== */

function makeStore(kind){
  let ok=true, backend=null; const mem={};
  try{ backend=window[kind]; const t='__probe__'; backend.setItem(t,'1'); backend.removeItem(t); }
  catch(e){ ok=false; backend=null; }
  return {
    get persistent(){return ok;},
    getItem(k){ if(ok){ try{ return backend.getItem(k); }catch(e){ ok=false; } } return (k in mem)?mem[k]:null; },
    setItem(k,v){ if(ok){ try{ backend.setItem(k,String(v)); return; }catch(e){ ok=false; } } mem[k]=String(v); },
    removeItem(k){ if(ok){ try{ backend.removeItem(k); return; }catch(e){ ok=false; } } delete mem[k]; }
  };
}
const LS = makeStore('localStorage');
const SS = makeStore('sessionStorage');

function shade(hex,amt){const h=(hex||'').replace('#','');if(h.length!==6)return hex;const n=parseInt(h,16);if(isNaN(n))return hex;const f=Math.max(0,1-amt);const c=[(n>>16)&255,(n>>8)&255,n&255].map(x=>Math.round(x*f).toString(16).padStart(2,'0'));return '#'+c.join('');}
const DEFAULT_FAVICON="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%8D%BC%3C%2Ftext%3E%3C%2Fsvg%3E";
function applyFavicon(){
  const u=(state.db.settings&&state.db.settings.faviconUrl)||'';
  const cur=document.getElementById('favicon'); if(cur) cur.remove();
  const link=document.createElement('link'); link.id='favicon'; link.rel='icon';
  if(u){ link.href=u; } else { link.href=DEFAULT_FAVICON; link.type='image/svg+xml'; }
  document.head.appendChild(link);
}
function applyTheme(){
  const t=state.db.settings.theme, r=document.documentElement.style;
  r.setProperty('--c-primary',t.primary);r.setProperty('--c-primary-d',t.primaryD);
  r.setProperty('--c-primary-strong',shade(t.primaryD,0.12));
  r.setProperty('--c-secondary',t.secondary);r.setProperty('--c-secondary-d',shade(t.secondary,0.38));
  r.setProperty('--c-accent',t.accent);r.setProperty('--c-bg',t.bg);
  const d=state.db.settings.deco; r.setProperty('--deco-opacity',d.enabled?d.opacity:0);
  // Photo frame style: set html.frame-XXX class so scoped CSS can override
  const frame = (state.db.settings && state.db.settings.photoFrame) || 'polaroid';
  const cls = document.documentElement.classList;
  ['frame-polaroid','frame-matted','frame-wood','frame-none'].forEach(c => cls.remove(c));
  cls.add('frame-' + frame);
  buildDeco();

}
function buildDeco(){
  const el=document.getElementById('deco'); if(!el)return; el.innerHTML='';

  for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=d.emoji[i%d.emoji.length];
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*8)+'s';s.style.fontSize=(1.4+Math.random()*1.8)+'rem';el.appendChild(s);}
}

function sortedGrowth(){return state.db.growth.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));}
function latestGrowth(){const g=sortedGrowth();return g[g.length-1];}
function dailyStats(){
  const logs=state.db.daily.slice().sort((a,b)=>new Date(b.time)-new Date(a.time));
  const t=todayStr();
  const today=logs.filter(x=>iso(new Date(x.time))===t);
  const feeds=today.filter(x=>x.type==='feeding');
  const totalMl=feeds.reduce((s,x)=>s+(+x.amount||0),0);
  const pee=today.filter(x=>x.type==='diaper'&&x.diaperType==='pee').length;
  const poop=today.filter(x=>x.type==='diaper'&&x.diaperType==='poop').length;
  const lastFeed=logs.find(x=>x.type==='feeding');
  const target=+state.db.settings.feeding.dailyTarget||900;
  return {feeds,totalMl,pee,poop,lastFeed,target,pct:Math.min(100,Math.round(totalMl/target*100)),logs,today};
}
function addFeeding(amount,feedType='formula',note=''){
  state.db.daily.push({id:uid(),type:'feeding',feedType,amount:+amount||state.db.settings.feeding.defaultAmount,time:new Date().toISOString(),note});

function localAnswer(text){
  const q=text.trim(), b=state.db.baby;
  const has=(...k)=>k.some(x=>q.includes(x));
  // actions (need login)
  const mFeed=q.match(/(记录|记一笔|添加|加).*?喂奶|喂奶.*?(\d+)|喝了?\s*(\d+)\s*(ml|毫升|亳升)/);
  if((has('记录','记一笔','添加')&&has('喂奶','奶'))||/喂奶.*\d+/.test(q)){
    if(!state.session.loggedIn) return {reply:'记录数据需要先登录后台哦，登录后我就能帮你记啦～'};
    const num=(q.match(/(\d{2,4})/)||[])[1];
    const bt=has('母乳','亲喂')?'breast':'formula';
    addFeeding(num||state.db.settings.feeding.defaultAmount,bt);
    const s=dailyStats();
    return {reply:`已记录一次喂奶 ${num||state.db.settings.feeding.defaultAmount}ml ✅ 今天累计 ${s.totalMl}ml / ${s.target}ml。`};
  }
  if(has('换尿布','尿布','拉了','便便','粑粑')&&has('记录','添加','记一笔')){
    if(!state.session.loggedIn) return {reply:'记录数据需要先登录后台哦～'};
    const dt=has('便','粑','拉')?'poop':'pee'; addDiaper(dt);
    return {reply:`已记录一次换尿布（${dt==='poop'?'大便':'小便'}）✅`};
  }
  // queries
  if(has('几岁','多大','年龄','几个月')) return {reply:`${b.name}现在 ${ageText(b.birthday)}，已经陪伴我们 ${daysOld(b.birthday)} 天啦 🎉`};
  if(has('多高','身高')){const g=latestGrowth();return {reply:`${b.name}最新身高是 ${g?.height} cm（${fmtDate(g?.date)}测量）📏`};}
  if(has('多重','体重','几斤','几公斤')){const g=latestGrowth();return {reply:`${b.name}最新体重是 ${g?.weight} kg（约${(g?.weight*2).toFixed(1)}斤）⚖️`};}
  if(has('上次喂','多久没','距离上次','上顿')){const s=dailyStats();return {reply:s.lastFeed?`距离上次喂奶已经 ${since(s.lastFeed.time)} 了（上次 ${s.lastFeed.amount||''}ml）🍼`:'今天还没有喂奶记录哦。'};}
  if(has('今天','今日')&&has('奶','喂','喝')){const s=dailyStats();return {reply:`今天已喂奶 ${s.feeds.length} 次，共 ${s.totalMl}ml，完成每日目标的 ${s.pct}%（目标 ${s.target}ml）。`};}
  if(has('尿布','便便','大便','小便')){const s=dailyStats();return {reply:`今天换尿布情况：小便 ${s.pee} 次，大便 ${s.poop} 次 👶`};}
  if(has('里程碑','最近','大事')){const m=state.db.milestones.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0];return {reply:m?`最近的里程碑是「${m.title}」（${fmtDate(m.date)}）：${m.desc}`:'还没有里程碑记录。'};}
  if(has('相册','照片','多少张')){const n=state.db.albums.reduce((s,a)=>s+a.photos.length,0);return {reply:`目前有 ${state.db.albums.length} 本相册，共 ${n} 张照片 📸`};}
  if(has('日记')) return {reply:`已经写了 ${state.db.diary.length} 篇成长日记，记录着每一个温柔的瞬间 📖`};
  if(has('留言')){const n=state.db.messages.filter(m=>m.status==='approved').length;return {reply:`留言墙上有 ${n} 条祝福留言 💌`};}
  if(has('你好','您好','hi','hello','在吗')) return {reply:`你好呀！我是${b.name}的成长小助手 🍼 你可以问我："宝宝多大了？""最新身高体重？""距上次喂奶多久？"，登录后还能让我帮你记录喂奶。`};
  if(has('帮助','能做什么','会什么','怎么用')) return {reply:'我可以帮你：\n· 查询年龄/身高/体重\n· 今日喂奶与尿布统计\n· 距上次喂奶时间\n· 最近里程碑、相册与留言\n· （登录后）语音记录喂奶/换尿布\n填入大模型 Key 后还能自然对话哦～'};
  return {reply:`我暂时不太确定怎么回答"${q}"。可以试试问我年龄、身高体重、喂奶统计或最近里程碑；或在后台"显示设置"填入大模型 API Key 开启自然语言对话。`,unknown:true};
}
async function llmAnswer(history){
  const cfg=state.db.settings.ai;
  const sys=`你是"${state.db.baby.name}"的成长记录网站里的智能助手，用简体中文、亲切温暖地回答。以下是实时数据，请据此回答：\n${dataSnapshot()}\n若用户想新增/修改数据，提示他们在后台操作（演示版仅支持问答与本地指令）。`;
  const msgs=[{role:'system',content:sys},...history.slice(-8)];
  const res=await fetch(cfg.baseUrl.replace(/\/$/,'')+'/chat/completions',{
    method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},
    body:JSON.stringify({model:cfg.model,messages:msgs,temperature:0.6})
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j=await res.json(); return j.choices?.[0]?.message?.content?.trim()||'（未返回内容）';
}

/* ---------- admin helpers ---------- */
const IMG_EXT=['jpg','jpeg','png','gif','webp','bmp','svg','avif','heic'];
const VID_EXT=['mp4','webm','ogg','ogv','mov','m4v','mkv'];
const UPLOAD_LIMITS_DEFAULT={imageMB:10,videoMB:200};
function fileKind(f){const ext=(f.name.split('.').pop()||'').toLowerCase();const ct=(f.type||'').toLowerCase();if(IMG_EXT.includes(ext)||ct.startsWith('image/'))return 'image';if(VID_EXT.includes(ext)||ct.startsWith('video/'))return 'video';return null;}
function checkFile(f){const lim=(state.db&&state.db.limits)||UPLOAD_LIMITS_DEFAULT;const k=fileKind(f);if(!k)return{ok:false,msg:'不支持的文件类型：'+f.name+'（仅支持图片和视频）'};const mb=k==='image'?(lim.imageMB||10):(lim.videoMB||200);if(f.size>mb*1024*1024)return{ok:false,msg:'文件过大：'+f.name+'（'+(k==='image'?'图片':'视频')+'上限 '+mb+'MB，当前 '+(f.size/1048576).toFixed(1)+'MB）'};return{ok:true};}
function pickFile(cb){const i=document.createElement('input');i.type='file';i.accept='image/*,video/*';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const v=checkFile(f);if(!v.ok){alert(v.msg);return;}uploadState.active=true;uploadState.pct=0;uploadState.label=f.name;uploadState.index=1;uploadState.total=1;const r=new FileReader();r.onprogress=ev=>{if(ev.lengthComputable)uploadState.pct=Math.round(ev.loaded/ev.total*100);};r.onload=()=>{uploadState.pct=100;uploadState.active=false;cb(r.result);};r.onerror=()=>{uploadState.active=false;alert('读取失败');};r.readAsDataURL(f);};i.click();}
function pickFiles(cb){const i=document.createElement('input');i.type='file';i.accept='image/*,video/*';i.multiple=true;i.onchange=e=>{const fs=[...e.target.files];if(!fs.length)return;const bad=fs.map(checkFile).find(v=>!v.ok);if(bad){alert(bad.msg);return;}uploadState.active=true;uploadState.total=fs.length;let idx=0;const next=()=>{if(idx>=fs.length){uploadState.active=false;return;}const f=fs[idx];uploadState.index=idx+1;uploadState.label=f.name;uploadState.pct=0;const r=new FileReader();r.onprogress=ev=>{if(ev.lengthComputable)uploadState.pct=Math.round(ev.loaded/ev.total*100);};r.onload=()=>{cb(r.result);idx++;next();};r.onerror=()=>{idx++;next();};r.readAsDataURL(f);};next();};i.click();}

function buildRecapLocal(period){
  const days=period==='month'?30:7; const end=Date.now(); const start=end-days*86400000;
  const name=state.db.baby.name; const label=period==='month'?'这一个月':'这一周';
  const inr=d=>{const t=new Date(d).getTime();return !isNaN(t)&&t>=start&&t<=end;};
  const ms=(state.db.milestones||[]).filter(m=>inr(m.date)).map(m=>m.title);
  const diary=(state.db.diary||[]).filter(x=>inr(x.date));
  const videos=(state.db.videos||[]).filter(v=>inr(v.date));
  let photos=0;(state.db.albums||[]).forEach(a=>(a.photos||[]).forEach(p=>{if(inr(p.takenAt))photos++;}));
  const feeds=(state.db.daily||[]).filter(d=>d.type==='feeding'&&inr(d.time));
  const totalMl=feeds.reduce((s,d)=>s+(+d.amount||0),0);
  const g=(state.db.growth||[]).filter(r=>inr(r.date)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const parts=[label+'，'+name+'又悄悄长大了一点。'];
  if(ms.length)parts.push('新解锁的里程碑：'+ms.join('、')+'。');
  const cs=[];if(diary.length)cs.push(diary.length+' 篇日记');if(photos)cs.push(photos+' 张照片');if(videos.length)cs.push(videos.length+' 段视频');
  if(cs.length)parts.push('我们一起记录了 '+cs.join('、')+'。');
  if(g.length)parts.push('最新身高 '+g[g.length-1].height+'cm、体重 '+g[g.length-1].weight+'kg。');
  if(feeds.length)parts.push('平均每天喝奶约 '+Math.round(totalMl/days)+'ml。');
  if(parts.length===1)parts.push('虽然没有留下太多新记录，但每一天的陪伴都很珍贵。');
  parts.push('期待下一段旅程里，'+name+'带来更多小惊喜 💕');
  return parts.join('');
}

    <div class="field"><label>备注</label><input v-model="editing.note"/></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn gray" @click="editing=null">取消</button><button class="btn" @click="save">保存</button></div>
  </div></div>
</div>` };

/* ---------- AI WIDGET ---------- */
const AiWidget={ setup(){
  const open=ref(false), input=ref(''), busy=ref(false), listening=ref(false);
  const msgs=reactive([{role:'assistant',content:`你好呀！我是${state.db.baby.name}的成长小助手 🍼\n问我"宝宝多大了""最新身高体重""距上次喂奶多久"都可以，登录后还能帮你语音记录喂奶～`}]);
  const bodyEl=ref(null);
  const mode=computed(()=>state.db.settings.ai.enabled&&state.db.settings.ai.apiKey?'AI 大模型':'内置助手');
  const quicks=['宝宝多大了？','最新身高体重','距上次喂奶多久','今天喝了多少奶','最近的里程碑'];
  function scrollB(){nextTick(()=>{if(bodyEl.value)bodyEl.value.scrollTop=bodyEl.value.scrollHeight;});}
  function speak(t){if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(t.replace(/[·•\n]/g,'，'));u.lang='zh-CN';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u);}}
  async function send(txt,spoken=false){const q=(txt??input.value).trim();if(!q||busy.value)return;
    msgs.push({role:'user',content:q});input.value='';busy.value=true;scrollB();
    let reply;
    try{
      if(state.db.settings.ai.enabled&&state.db.settings.ai.apiKey){reply=await llmAnswer(msgs.filter(m=>m.role!=='system'));}
      else{reply=localAnswer(q).reply;}
    }catch(e){reply=localAnswer(q).reply+`\n\n（大模型调用失败：${e.message}，已用内置助手回答）`;}
    msgs.push({role:'assistant',content:reply});busy.value=false;scrollB();if(spoken)speak(reply);
  }
  let rec;
  function voice(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('当前浏览器不支持语音识别，建议用 Chrome / Edge');return;}
    if(listening.value){rec&&rec.stop();return;}
    rec=new SR();rec.lang='zh-CN';rec.interimResults=false;
    rec.onstart=()=>listening.value=true;rec.onend=()=>listening.value=false;
    rec.onerror=()=>listening.value=false;
    rec.onresult=e=>{const t=e.results[0][0].transcript;input.value=t;send(t,true);};
    rec.start();
  }
  watch(open,v=>{if(v)scrollB();});
  return {open,input,busy,listening,msgs,bodyEl,mode,quicks,send,voice};
}, template:`
<div>
  <transition name="fade"><div class="ai-panel" v-if="open">
    <div class="ai-head"><span style="font-size:1.3rem">🤖</span><div><b>成长小助手</b></div><span class="st">{{mode}}</span>
      <button @click="open=false" style="color:#fff;margin-left:8px;font-size:1.2rem">✕</button></div>
    <div class="ai-body" ref="bodyEl">
      <div v-for="(m,i) in msgs" :key="i" class="bub" :class="m.role==='user'?'me':'ai'">{{m.content}}</div>
      <div v-if="busy" class="bub ai">正在思考…</div>
    </div>
    <div class="ai-quick"><button v-for="q in quicks" :key="q" @click="send(q)">{{q}}</button></div>
    <div class="ai-input">
      <button class="mic" :class="{rec:listening}" @click="voice" title="语音">🎤</button>
      <input v-model="input" @keyup.enter="send()" placeholder="问我关于宝贝的事…"/>
      <button @click="send()">➤</button>
    </div>
  </div></transition>
  <button class="ai-fab" @click="open=!open">{{open?'💬':'🤖'}}</button>
</div>` };

/* ---------- ROOT APP ---------- */
const AuthGate={ setup(){
  const tab=ref('login'); const form=reactive({u:'',p:'',code:'',remember:false}); const err=ref(''); const busy=ref(false);
  const regHint='演示邀请码：FAMILY-2024';
  onMounted(()=>{try{const r=JSON.parse(LS.getItem('bgt_remember')||'null');if(r){form.u=r.u;form.p=r.p;form.remember=true;}}catch(e){}});
  function login(){err.value='';const u=(state.db.users||[]).find(x=>x.username===form.u&&x.password===form.p);if(!u){err.value='账号或密码不正确';return;}if(u.disabled){err.value='该账号已被禁用，请联系管理员';return;}setSession(u,form.remember);go('home');}
  function register(){err.value='';if(!form.u||form.p.length<4){err.value='请填写用户名，密码至少 4 位';return;}const inv=(state.db.invites||[]).find(i=>i.code===form.code&&!i.usedBy);if(!inv){err.value='邀请码无效或已被使用';return;}if((state.db.users||[]).find(x=>x.username===form.u)){err.value='该用户名已被注册';return;}const nu={id:uid(),username:form.u,password:form.p,role:'member'};state.db.users.push(nu);inv.usedBy=form.u;inv.usedAt=new Date().toISOString();setSession(nu,false);go('home');}
  function submit(){tab.value==='login'?login():register();}
  return {tab,form,err,busy,submit,regHint,state};
}, template:`
<div class="login-wrap"><div class="card login-card">
  <div style="text-align:center;margin-bottom:16px"><div style="display:flex;justify-content:center;margin-bottom:6px"><img v-if="state.db.settings.faviconUrl" :src="state.db.settings.faviconUrl" alt="站点图标" style="width:64px;height:64px;border-radius:16px;object-fit:contain;background:#fff;box-shadow:var(--shadow-sm);padding:6px"/><div v-else style="font-size:2.4rem">🍼</div></div><h2>{{tab==='login'?'欢迎回来':'注册家庭账号'}}</h2><p style="color:var(--c-muted);font-size:.9rem">{{tab==='login'?'登录后查看宝贝的成长记录':'凭管理员邀请码创建账号'}}</p></div>
  <div style="display:flex;gap:6px;margin-bottom:18px"><button class="btn sm" :class="{gray:tab!=='login'}" style="flex:1" @click="tab='login';err=''">登录</button><button class="btn sm" :class="{gray:tab!=='register'}" style="flex:1" @click="tab='register';err=''">注册</button></div>
  <div class="field"><label>用户名</label><input v-model="form.u" @keyup.enter="submit" placeholder="用户名"/></div>
  <div class="field"><label>密码</label><input v-model="form.p" type="password" @keyup.enter="submit" placeholder="密码"/></div>
  <div class="field" v-if="tab==='register'"><label>邀请码</label><input v-model="form.code" @keyup.enter="submit" placeholder="管理员提供的邀请码"/></div>
  <label class="checkline" v-if="tab==='login'" style="margin-bottom:16px"><input type="checkbox" v-model="form.remember"/> 记住账号密码（本设备）</label>
  <p v-if="err" style="color:#e0576a;margin-bottom:12px">⚠️ {{err}}</p>
  <button class="btn" style="width:100%" :disabled="busy" @click="submit">{{busy?'请稍候…':(tab==='login'?'登 录':'注册并进入')}}</button>
  <p v-if="tab==='register'" style="text-align:center;color:var(--c-muted);font-size:.82rem;margin-top:14px">{{regHint}}</p>
</div></div>` };

const AdInvites={ setup(){
  const list=computed(()=>state.db.invites||[]);
  function gen(){state.db.invites.unshift({id:uid(),code:'FAM-'+Math.random().toString(36).slice(2,8).toUpperCase(),note:'',usedBy:null,usedAt:null,createdAt:new Date().toISOString()});}
  async function del(i){if(await confirmDialog('撤销邀请码 '+i.code+' ？'))state.db.invites=state.db.invites.filter(x=>x.id!==i.id);}
  return {list,gen,del};
}, template:`
<div>
  <div class="admin-head"><h2>🎟️ 邀请码管理</h2><button class="btn" @click="gen">+ 生成邀请码</button></div>
  <p style="color:var(--c-muted);margin-bottom:14px">家人凭一个未使用的邀请码即可注册账号登录查看。</p>
  <div class="list-row" v-for="i in list" :key="i.id">
    <div class="grow"><b style="font-family:monospace;font-size:1.05rem;letter-spacing:1px">{{i.code}}</b><small>{{i.note||'—'}} · {{i.used?('已被 '+i.usedBy+' 使用'):'未使用'}}</small></div>
    <span class="pill" :class="i.used?'ok':'pend'">{{i.used?'已使用':'可用'}}</span>
    <button v-if="!i.used" class="btn danger sm" @click="del(i)">撤销</button>
  </div>
  <p v-if="!list.length" style="color:var(--c-muted)">还没有邀请码，点右上角生成一个发给家人。</p>
</div>` };

const App={ components:{SiteNav,SiteFooter,Lightbox,AiWidget,AuthGate,ShareView}, setup(){
  const views={home:Home,timeline:Timeline,gallery:Gallery,videos:Videos,growth:Growth,vaccine:Vaccine,daily:Daily,diary:Diary,messages:Messages,about:About,profile:Profile,login:Login,admin:Admin};
  const cur=computed(()=>{const n=route.name;const v=views[n];if(!v)return Home;
    if(['timeline','gallery','videos','growth','vaccine','daily','diary','messages','about'].includes(n)&&state.db.settings.modules[n]===false)return Home;if(n==='admin'&&state.session.role!=='admin')return Home;return v;});
  const showFooter=computed(()=>!['login','admin'].includes(route.name));
  watch(()=>[route.name,route.params.id],()=>observeReveals());
  return {cur,showFooter,state,route,up:uploadState,cf:confirmState,confirmYes,confirmNo};
}, template:`
<div>
  <ShareView v-if="route.name==='share'"/>
  <AuthGate v-else-if="!state.session.loggedIn"/>
  <template v-else>
    <SiteNav/>
    <main><component :is="cur"/></main>
    <SiteFooter v-if="showFooter"/>
    <AiWidget/>
  </template>
  <div v-if="up.active" class="upbar"><div class="upbar-card"><div class="upbar-row"><span>⬆️ 正在上传 {{up.label}}<template v-if="up.total>1"> · {{up.index}}/{{up.total}}</template></span><b>{{up.pct}}%</b></div><div class="upbar-track"><i :style="{width:up.pct+'%'}"></i></div></div></div>
  <div v-if="cf.open" class="modal-bg" style="z-index:210" @click.self="confirmNo">
    <div class="card" style="max-width:360px;padding:26px;text-align:center">
      <div style="font-size:2rem">🗑️</div>
      <p style="margin:12px 0 22px;color:#5b5870;white-space:pre-wrap">{{cf.message}}</p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="btn gray" @click="confirmNo">取消</button><button class="btn danger" @click="confirmYes">确定删除</button></div>
    </div>
  </div>
  <Lightbox/>
</div>` };

app.config.globalProperties.isVideo=isVideo;app.config.globalProperties.vxInfo=vxInfo;app.config.globalProperties.vxMonLabel=vxMonLabel;
