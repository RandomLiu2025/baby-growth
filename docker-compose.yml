services:
  app:
    build: .
    container_name: baby-growth
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      # 可用根目录 .env 覆盖（deploy.sh 会自动生成随机 SECRET_KEY）
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-please-use-a-long-random-string}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Shanghai}
      - DATABASE_URL=sqlite:///./data/baby.db
      - UPLOAD_DIR=./data/uploads
      - BACKUP_DIR=./data/backups
      - BACKUP_RETENTION=${BACKUP_RETENTION:-2}
      - MAX_IMPORT_MB=${MAX_IMPORT_MB:-20}
      - MAX_IMPORT_RECORDS=${MAX_IMPORT_RECORDS:-50000}
      - AUTO_BACKUP_BEFORE_MIGRATION=${AUTO_BACKUP_BEFORE_MIGRATION:-true}
      - CLIENT_DIR=/app/client
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - AI_ALLOW_PRIVATE_BASE_URLS=${AI_ALLOW_PRIVATE_BASE_URLS:-false}
      - MAX_IMAGE_MB=${MAX_IMAGE_MB:-10}
      - MAX_VIDEO_MB=${MAX_VIDEO_MB:-200}
      - MAX_UPLOAD_FILES=${MAX_UPLOAD_FILES:-20}
      - CHUNK_TTL_HOURS=${CHUNK_TTL_HOURS:-24}
      - MIN_UPLOAD_FREE_MB=${MIN_UPLOAD_FREE_MB:-512}
      - MAX_IMAGE_PIXELS=${MAX_IMAGE_PIXELS:-100000000}
      - MAX_VIDEO_DURATION_SECONDS=${MAX_VIDEO_DURATION_SECONDS:-3600}
      - MAX_VIDEO_PIXELS=${MAX_VIDEO_PIXELS:-8294400}
      - MAX_VIDEO_FPS=${MAX_VIDEO_FPS:-60}
      - MAX_CONCURRENT_UPLOADS=${MAX_CONCURRENT_UPLOADS:-6}
      - MAX_CONCURRENT_MEDIA_JOBS=${MAX_CONCURRENT_MEDIA_JOBS:-2}
      - MEDIA_PROBE_TIMEOUT_SECONDS=${MEDIA_PROBE_TIMEOUT_SECONDS:-15}
      - MEDIA_PROCESS_TIMEOUT_SECONDS=${MEDIA_PROCESS_TIMEOUT_SECONDS:-1800}
    volumes:
      # 数据库与上传文件持久化到宿主机 ./data，备份只需复制该目录
      - ./data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 反向代理 + 自动 HTTPS（仅在 --profile proxy 时启用，无需宿主机装 nginx）
  # 启用： SITE_ADDRESS=你的域名 docker compose --profile proxy up -d --build
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  restic:
    image: restic/restic:0.17.3
    profiles: ["backup"]
    environment:
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./data/backups:/backups:ro
      - restic_cache:/root/.cache/restic
    entrypoint: ["restic"]

volumes:
  caddy_data:
  caddy_config:
  restic_cache:
