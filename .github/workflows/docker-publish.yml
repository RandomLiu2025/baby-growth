name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  # Docker Hub（必配）：Settings -> Secrets 配置
  #   DOCKERHUB_USERNAME: Docker Hub 用户名
  #   DOCKERHUB_TOKEN:    Docker Hub 的 Access Token（Account Settings -> Security）
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  # 阿里云 ACR（可选，国内服务器拉取快、不受镜像加速白名单限制）：
  #   ALIYUN_REGISTRY:  ACR 地址，如 registry.cn-hangzhou.aliyuncs.com
  #   ALIYUN_NAMESPACE: ACR 中的命名空间
  #   ALIYUN_USERNAME / ALIYUN_PASSWORD: ACR 访问凭证（个人版即阿里云账号/密码）
  # 未配置 ALIYUN_REGISTRY 时自动跳过阿里云推送，不影响 Docker Hub 发布。
  ALIYUN_ENABLED: ${{ secrets.ALIYUN_REGISTRY != '' && github.event_name != 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: env.ALIYUN_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/baby-growth
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract Aliyun image metadata
        if: env.ALIYUN_ENABLED == 'true'
        id: meta-aliyun
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/baby-growth
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to Aliyun ACR
        if: env.ALIYUN_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-aliyun.outputs.tags }}
          labels: ${{ steps.meta-aliyun.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
